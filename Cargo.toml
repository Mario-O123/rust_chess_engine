[package]
name = "rust_chess_engine"
version = "0.1.0"
edition = "2024"
default-run = "bot"

[dependencies]
once_cell = "1"
rand = "0.8"
anyhow = "1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

burn = { version = "0.20.0", optional = true, default-features = false, features = ["ndarray", "std"] }

# Bot dependencies
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
dotenv = "0.15"

[features]
default = []
nn = ["dep:burn"]
trainer = ["dep:burn", "burn/autodiff", "burn/dataset"]

# Binary for running the bot
[[bin]]
name = "bot"
path = "src/bin/bot.rs"

[[bin]]
name = "terminal_proto_classical"
path = "src/bin/terminal_proto_classical.rs"

[[bin]]
name = "terminal_proto_neural"
path = "src/bin/terminal_proto_neural.rs"
required-features = ["nn"]